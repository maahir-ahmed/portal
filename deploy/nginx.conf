# Requests arrive from the cloudflared container on the compose bridge, so without
# this every line in the log reads 172.x.0.1. Only the bridge is trusted as a proxy:
# anything reaching the published port from elsewhere keeps its own address and
# cannot spoof a client IP through the header.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Combined, plus how long the request took and how much of that the app took.
log_format tunnel '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time urt=$upstream_response_time';

server {
  listen 80;
  server_name _;

  # /var/log/nginx/access.log is the image's symlink to stdout, so this stays in
  # `docker logs` rather than growing a file nothing rotates.
  access_log /var/log/nginx/access.log tunnel;

  # Uploads are capped at MAX_FILE_SIZE_MB (default 10) in the app; leave headroom
  # so a rejected upload gets the app's error, not nginx's.
  client_max_body_size 25m;

  # Re-resolve the app container on every request. Compose hands it a new IP on each
  # deploy, and a name resolved once at startup would keep pointing at the dead one —
  # the maintenance page would then never go away. 127.0.0.11 is Docker's embedded DNS.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream http://app:3000;
    proxy_pass $upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Next streams its HTML; buffering it would hold the page back until complete.
    proxy_buffering off;
    # Fail over to the maintenance page quickly while the new container boots.
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;

    # Only nginx's own upstream failures land here. proxy_intercept_errors stays off,
    # so a 500 the app itself returns still reaches the browser as the app's page.
    #
    # =503 matters: Cloudflare discards the body of a 502 or 504 from the origin and
    # substitutes its own "error code: 502" text, so the page below would never be
    # seen. It passes a 503 through untouched, and 503 + Retry-After is the correct
    # status for "briefly down on purpose" anyway. The override needs a URI here —
    # with a named location nginx keeps the original 502.
    error_page 502 503 504 =503 /maintenance.html;
  }

  location = /maintenance.html {
    internal;
    root /usr/share/nginx/html;
    add_header Retry-After 20 always;
    add_header Cache-Control "no-store" always;
  }
}
