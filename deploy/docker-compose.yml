# One compose file for the hosted stacks and for self-hosting. Pick the stack via --env-file:
#   prod: docker compose --env-file deploy/.env.prod -p rubric_prod -f deploy/docker-compose.yml up -d --build
#   dev:  docker compose --env-file deploy/.env.dev  -p rubric_dev  -f deploy/docker-compose.yml up -d --build
# The hosted stacks build from source, and their own cloudflared reaches the app via
# host.docker.internal:${APP_PORT}. A self-hosted stack (./portal, docs/SELF_HOSTING.md)
# pulls the published images instead (APP_IMAGE, WEB_IMAGE, BACKUP_IMAGE) and turns on
# one of the cloudflare or caddy profiles below. Unset, each image is named after the
# stack, which is what compose called them before these settings existed.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: society_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: society_platform
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U society_user -d society_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # One-off seed. Built from the `builder` stage (has tsx + full deps the runtime image lacks).
  # Run on demand:  docker compose ... --profile seed run --rm seed
  seed:
    build: { context: .., dockerfile: Dockerfile, target: builder }
    command: sh -c "npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://society_user:${DB_PASSWORD}@db:5432/society_platform?schema=public
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # The demo stack's invented dataset and logo (deploy/README.md, Demo stack).
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-}
      SEED_LOGO_URL: ${SEED_LOGO_URL:-}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"
    profiles: ["seed"]

  app:
    build: { context: .., dockerfile: Dockerfile }
    image: ${APP_IMAGE:-${STACK}-app}
    container_name: ${STACK}_app
    restart: unless-stopped
    # Sync schema (idempotent) then start the server, no separate migrate container to clean up.
    # $$ escapes compose interpolation so sh expands the runtime DATABASE_URL.
    # db push gets --accept-data-loss unless DB_PUSH_FLAGS is set. The hosted stacks leave
    # it unset (ceiling: a destructive schema change applies silently). The installer sets
    # it empty, so on a self-hosted stack, which updates itself overnight, a change that
    # would drop data stops the app starting instead, and `./portal update` rolls back.
    # One-time data fixes that must run BEFORE the push (e.g. the PrintingStatus enum
    # remap) are applied out-of-band via psql. Fixes that must run AFTER it live in
    # prisma/post-push/ and apply themselves once each (scripts/post-push.mjs).
    # The prisma CLI is baked into the image at the lockfile's version (see Dockerfile);
    # the image has no prisma.config.ts, hence --schema and --url.
    # First, prisma/app-role.sql, as the superuser: the app itself connects as portal_app,
    # which owns the schema but can't reach outside the database.
    command: sh -c "psql \"$$DB_ADMIN_URL\" -v ON_ERROR_STOP=1 -v pw=\"$$DB_PASSWORD\" -f prisma/app-role.sql && prisma db push --schema=prisma/schema.prisma --url \"$$DATABASE_URL\" ${DB_PUSH_FLAGS---accept-data-loss} && node scripts/post-push.mjs && node server.js"
    # No published port: the web service in front owns ${APP_PORT} so that something
    # still answers while this container is being rebuilt.
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://portal_app:${DB_PASSWORD}@db:5432/society_platform?schema=public
      # Used only by the start command above, to set up portal_app.
      DB_ADMIN_URL: postgresql://society_user:${DB_PASSWORD}@db:5432/society_platform
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Society Platform}
      SOCIETY_SLUG: ${SOCIETY_SLUG:-}
      # Public demo stack: no login, everyone shares DEMO_EMAIL. Only safe on a
      # database with seed data and no Rubric credentials — see deploy/README.md.
      DEMO_MODE: ${DEMO_MODE:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@society.local}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      # Encrypts the Rubric session and Discord webhook URLs at rest (src/lib/secrets.ts).
      # Optional: empty stores them in plain text, which is how older stacks still run.
      RUBRIC_SECRET_KEY: ${RUBRIC_SECRET_KEY:-}
      # Settings > Debugging (database viewer, backup, restore, raw SQL). Off unless set
      # to true, and always off with DEMO_MODE. See deploy/README.md.
      ENABLE_DEBUG_TOOLS: ${ENABLE_DEBUG_TOOLS:-false}
      # First-run setup: /setup?token=<SETUP_TOKEN> makes the first account on an empty
      # database, and does nothing once any account exists. ADMIN_EMAIL prefills it.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Discord deadline reminders (src/lib/reminders.ts): "on" pings under each event's
      # post as its deadline nears. Off unless set, so existing stacks don't start
      # pinging on upgrade; the installer sets it. The /print bot is a spike, off unless
      # ENABLE_DISCORD_BOT=true: see docs/DISCORD_BOT_SPIKE.md.
      DISCORD_REMINDERS: ${DISCORD_REMINDERS:-}
      ENABLE_DISCORD_BOT: ${ENABLE_DISCORD_BOT:-false}
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      # Optional: the society's Discord server ID; /print is then refused anywhere else.
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Self-hosted updates (src/lib/updates.ts): the image this runs, to find newer
      # releases on its channel, and the token `./portal tick` checks in with. Unset on
      # the hosted stacks, which hides the update card and banner.
      APP_IMAGE: ${APP_IMAGE:-}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      STACK: ${STACK}
      UPLOADS_DIR: /app/uploads
      BACKUP_OUT: /app/backups
    volumes:
      - uploads_data:/app/uploads
      # The Debugging tab's own archives. A volume rather than ${BACKUP_DIR}: the app
      # runs as an unprivileged user that cannot write to a host folder it doesn't own.
      # Same format as the daily backups, so either restores with either.
      - debug_backups:/app/backups
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  # Holds the public port so a deploy never leaves the tunnel with nothing to talk to:
  # while app is being recreated this serves maintenance.html as a 502 instead.
  # Its own config rarely changes, so `up -d --build` leaves it running.
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    image: ${WEB_IMAGE:-${STACK}-web}
    container_name: ${STACK}_web
    restart: unless-stopped
    ports:
      # The hosted stacks' cloudflared hits host.docker.internal:${APP_PORT}, which needs
      # every interface. A self-hosted stack binds 127.0.0.1: its tunnel or Caddy is on
      # the compose network, and the port is only for opening it on the machine itself.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT}:80"
    networks: [internal]

  # Dumps the database and archives the uploads volume into ${BACKUP_DIR} daily,
  # keeping ${BACKUP_KEEP_DAYS}. Part of the stack rather than a host crontab line,
  # because the crontab line was documented and never installed — for months the
  # only backup on this box was one manual dump.
  backup:
    build: { context: ., dockerfile: Dockerfile.backup }
    image: ${BACKUP_IMAGE:-${STACK}-backup}
    container_name: ${STACK}_backup
    restart: unless-stopped
    environment:
      STACK: ${STACK}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Australia/Sydney}   # so BACKUP_HOUR means the local 3am
    volumes:
      # Writable so `backup restore` can put the uploads back (deploy/README.md).
      - uploads_data:/uploads
      - ${BACKUP_DIR:-../../rubric-backups}:/backups
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  # Self-hosting, domain method 1 (recommended): a Cloudflare Tunnel. No open ports, and
  # it works behind home and university networks. The tunnel's public hostname points at
  # http://web:80, set where the token was made (docs/SELF_HOSTING.md).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${STACK}_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]
    networks: [internal]
    profiles: ["cloudflare"]

  # Self-hosting, domain method 2: Caddy, for a server with a public IP. Gets and renews
  # the HTTPS certificate itself; needs ports 80 and 443 open and DOMAIN pointing here.
  caddy:
    image: caddy:2-alpine
    container_name: ${STACK}_caddy
    restart: unless-stopped
    # nginx takes the client's address from CF-Connecting-IP. Here nothing but Caddy
    # sits in front, so overwrite it with the real peer rather than pass on a forged one.
    # A list, not one line: YAML reads the ": " in the header as a key otherwise.
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "web:80", "--header-up", "CF-Connecting-IP: {http.request.remote.host}"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [internal]
    profiles: ["caddy"]

volumes:
  caddy_data:
  caddy_config:
  db_data:
  uploads_data:
  debug_backups:

networks:
  internal:
