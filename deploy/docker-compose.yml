# One compose file for both hosted stacks. Pick the stack via --env-file:
#   prod: docker compose --env-file deploy/.env.prod -p rubric_prod -f deploy/docker-compose.yml up -d --build
#   dev:  docker compose --env-file deploy/.env.dev  -p rubric_dev  -f deploy/docker-compose.yml up -d --build
# cloudflared reaches the app via host.docker.internal:${APP_PORT} (matches the existing tunnel setup).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: society_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: society_platform
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U society_user -d society_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # One-off seed. Built from the `builder` stage (has tsx + full deps the runtime image lacks).
  # Run on demand:  docker compose ... --profile seed run --rm seed
  seed:
    build: { context: .., dockerfile: Dockerfile, target: builder }
    command: sh -c "npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://society_user:${DB_PASSWORD}@db:5432/society_platform?schema=public
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"
    profiles: ["seed"]

  app:
    build: { context: .., dockerfile: Dockerfile }
    container_name: ${STACK}_app
    restart: unless-stopped
    # Sync schema (idempotent) then start the server, no separate migrate container to clean up.
    # $$ escapes compose interpolation so sh expands the runtime DATABASE_URL.
    # Note: db push + --accept-data-loss; ceiling = destructive schema change applies silently.
    # One-time data fixes (e.g. the PrintingStatus enum remap, the TreasuryStatus one)
    # are applied out-of-band via psql, because `prisma db execute` can't run in this
    # image (no CLI shipped; npx-fetched prisma can't load the TS config). db push
    # alone reconciles fresh DBs correctly.
    command: sh -c "npx prisma db push --schema=prisma/schema.prisma --url \"$$DATABASE_URL\" --accept-data-loss && node server.js"
    # No published port: the web service in front owns ${APP_PORT} so that something
    # still answers while this container is being rebuilt.
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://society_user:${DB_PASSWORD}@db:5432/society_platform?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Society Platform}
      SOCIETY_SLUG: ${SOCIETY_SLUG:-}
      # Public demo stack: no login, everyone shares DEMO_EMAIL. Only safe on a
      # database with seed data and no Rubric credentials — see deploy/README.md.
      DEMO_MODE: ${DEMO_MODE:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@society.local}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  # Holds the public port so a deploy never leaves the tunnel with nothing to talk to:
  # while app is being recreated this serves maintenance.html as a 502 instead.
  # Its own config rarely changes, so `up -d --build` leaves it running.
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    container_name: ${STACK}_web
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"   # cloudflared hits host.docker.internal:${APP_PORT}
    networks: [internal]

  # Dumps the database and archives the uploads volume into ${BACKUP_DIR} daily,
  # keeping ${BACKUP_KEEP_DAYS}. Part of the stack rather than a host crontab line,
  # because the crontab line was documented and never installed — for months the
  # only backup on this box was one manual dump.
  backup:
    build: { context: ., dockerfile: Dockerfile.backup }
    container_name: ${STACK}_backup
    restart: unless-stopped
    environment:
      STACK: ${STACK}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Australia/Sydney}   # so BACKUP_HOUR means the local 3am
    volumes:
      - uploads_data:/uploads:ro
      - ${BACKUP_DIR:-../../rubric-backups}:/backups
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

volumes:
  db_data:
  uploads_data:

networks:
  internal:
