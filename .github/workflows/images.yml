# Publishes the images a self-hosted portal runs (./portal, docs/SELF_HOSTING.md):
#   ghcr.io/<owner>/<repo>-app, -web and -backup, each for amd64 and arm64 (a Raspberry
#   Pi or an ARM server). `latest` follows main; a v1.2.3 tag also publishes 1.2.3, 1.2 and 1. Self-hosted
#   portals follow `1` (the installer's choice), so they get every 1.x release, and a
#   v2.0.0 waits until someone moves them to `2` on purpose.
# Each architecture builds on its own native runner, which takes minutes where emulating
# arm64 takes most of an hour, and the two are then joined under one tag.
# The hosted stacks don't use these: they build from source on the box (deploy.yml).
# Every action is pinned to a commit, not a tag: these images install themselves on
# self-hosted portals overnight, so a moved or hijacked tag must not reach them.
name: Images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [app, web, backup]
        arch: [amd64, arm64]
        include:
          - { image: app, context: ., file: Dockerfile }
          - { image: web, context: deploy, file: deploy/Dockerfile.web }
          - { image: backup, context: deploy, file: deploy/Dockerfile.backup }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.4.0 for a v1.4.0 tag, main-<sha> otherwise. Shown in Settings, and compared
      # with the newest release to offer an update.
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="main-${GITHUB_SHA::7}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest for the merge
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  merge:
    needs: build
    strategy:
      matrix:
        image: [app, web, backup]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Join both architectures under the tags
        working-directory: digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.image }}
        run: |
          # shellcheck disable=SC2046 # each tag and digest is its own argument
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
