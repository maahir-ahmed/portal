# Self-hosted runner on the mini PC. push to main -> prod and the PC Society portal,
# push to demo -> the public demo stack. dev is the working branch and deploys nowhere. The demo stack keeps the
# rubric_dev project name and deploy/.env.dev so its containers, volumes and nginx
# upstream are untouched by the branch switch.
# Deploys from the PERSISTENT clone (~/containers/society-project) which holds the
# gitignored .env files and the named volumes, NOT the runner's throwaway checkout.
name: Deploy
on:
  push:
    branches: [main, demo]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          REPO="$HOME/containers/society-project"
          BRANCH="${{ github.ref_name }}"
          cd "$REPO"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          # project:envfile pairs. main runs every society's production stack on the
          # same code; a stack whose env file isn't on the box is skipped, not failed.
          if [ "$BRANCH" = "main" ]; then
            STACKS="rubric_prod:deploy/.env.prod pcsoc_portal:deploy/.env.pcsoc"
          else
            STACKS="rubric_dev:deploy/.env.dev"
          fi

          for s in $STACKS; do
            PROJECT="${s%%:*}"; ENVFILE="${s#*:}"
            if [ ! -f "$ENVFILE" ]; then echo "skipping $PROJECT: no $ENVFILE"; continue; fi
            docker compose --env-file "$ENVFILE" -p "$PROJECT" \
              -f deploy/docker-compose.yml up -d --build --remove-orphans
          done
          docker image prune -f
