# Self-hosted runner on the mini PC. push to main -> prod and the PC Society portal,
# push to demo -> the public demo stack. dev is the working branch and deploys nowhere. The demo stack keeps the
# rubric_dev project name and deploy/.env.dev so its containers, volumes and nginx
# upstream are untouched by the branch switch.
# Deploys from the PERSISTENT clone (~/containers/society-project) which holds the
# gitignored .env files and the named volumes, NOT the runner's throwaway checkout.
name: Deploy
on:
  push:
    branches: [main, demo]

# The job only runs commands on the box; its token needs nothing beyond reading.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm run lint
          npm run check:tutorial
          npm run check:rubric
          npm run check:passphrase
          npm run check:ahegs
          npm run check:bookings
          npm run check:years
          npm run check:modules
          npm run check:debug
          npm run check:import
          npm run check:urgency
          npm run check:discord
          npm run check:updates
          npm run check:security

  deploy:
    needs: checks
    runs-on: self-hosted
    steps:
      - name: Deploy
        # Through env, not interpolated into the script: a ref name is never shell code.
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REPO="$HOME/containers/society-project"
          cd "$REPO"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          # project:envfile pairs. main runs every society's production stack on the
          # same code; a stack whose env file isn't on the box is skipped, not failed.
          if [ "$BRANCH" = "main" ]; then
            STACKS="rubric_prod:deploy/.env.prod pcsoc_portal:deploy/.env.pcsoc"
          else
            STACKS="rubric_dev:deploy/.env.dev"
          fi

          for s in $STACKS; do
            PROJECT="${s%%:*}"; ENVFILE="${s#*:}"
            if [ ! -f "$ENVFILE" ]; then echo "skipping $PROJECT: no $ENVFILE"; continue; fi
            docker compose --env-file "$ENVFILE" -p "$PROJECT" \
              -f deploy/docker-compose.yml build --pull
            docker compose --env-file "$ENVFILE" -p "$PROJECT" \
              -f deploy/docker-compose.yml up -d --build --remove-orphans
          done
          docker image prune -f
